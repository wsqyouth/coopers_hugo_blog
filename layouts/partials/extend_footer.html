{{- /* 自定义 JavaScript - 在页面底部加载 */ -}}

{{- /* Mermaid 图表支持 */ -}}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
  const elements = document.querySelectorAll('.mermaid');
  for (let i = 0; i < elements.length; i++) {
    try {
      const { svg } = await mermaid.render('mermaid-' + i, elements[i].textContent.trim());
      const div = document.createElement('div');
      div.innerHTML = svg;
      div.firstChild.querySelectorAll('.copy-code').forEach(btn => btn.remove());
      elements[i].replaceWith(div.firstChild);
    } catch (e) {
      console.warn('Mermaid render failed for diagram ' + i + ':', e);
    }
  }
</script>
