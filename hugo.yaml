baseURL: https://www.wsqyouth.cn/ # 绑定的域名
# baseURL 必须是**最终**地址（https）。之前写的是 http，而线上 http 会 301 跳 https，
# 于是 canonical / og:url / twitter:url / schema.org JSON-LD / sitemap.xml / RSS
# 全都指向了 http —— 等于告诉搜索引擎"正式地址是 http"，与实际访问到的地址不一致。
languageCode: zh-cn # en-us
title: Cooper's Blog
theme: PaperMod # 主题名字，和themes文件夹下的一致

enableInlineShortcodes: true
enableEmoji: true # 允许使用 Emoji 表情，建议 true
enableRobotsTXT: true # 允许爬虫抓取到搜索引擎，建议 true

hasCJKLanguage: true # 自动检测是否包含 中文日文韩文 如果文章中使用了很多中文引号的话可以开启

buildDrafts: false
buildFuture: false
buildExpired: false

summaryLength: 70  # 摘要字数限制（中文约35字）

#googleAnalytics: UA-123-45 # 谷歌统计
# Copyright: Cooper

pagination:
    pagerSize: 10    # 首页每页显示的文章数

minify:
    disableXML: true
    # minifyOutput: true

permalinks:
  posts: "/:year/:month/:day/:slug/"
  # post: "/:title/"
  # post: "/:year/:month/:day/:title/"

defaultContentLanguage: en # 最顶部首先展示的语言页面
defaultContentLanguageInSubdir: false

languages:
    en:
      languageName: "English"
      # contentDir: content/english
      weight: 1
      # 顶层导航 = 站点的骨架：去哪一类内容。
      # 只放"少而重要"的——分类/标签/系列这类"多而杂"的索引放侧栏，
      # 搜索入口也只在侧栏出现一次（同一件事不要三个入口）。
      menu:
        main:
          - identifier: home
            name: 首页
            url: /
            weight: 1
          - identifier: archives
            name: 归档
            url: archives/
            weight: 2
          - identifier: notes
            name: 笔记
            url: notes/
            weight: 3
          - identifier: projects
            name: 项目
            url: projects/
            weight: 4
          - identifier: about
            name: 关于
            url: about/
            weight: 5

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms

# llms.txt：给 AI 爬虫看的站点索引（llmstxt.org 约定）。纯静态生成，零成本。
# 内容全在一页里，模型抓一次就知道这个站有什么、值不值得读。
outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

params:
    env: production # to enable google analytics, opengraph, twitter-cards and schema.
    description: "Coopers 的个人网站：分享后端工程与 AI 协作实践，记录 EchoFlow、ReadFlow、NoteFlow 的打磨过程。"
    author: Coopers
    authorIntro:
        bio: "你好，我是 Coopers，一名后端工程师。用 AI 把日常里的想法做成作品，也写下开发中的经验、取舍和还没想明白的事。"
        wechatName: "写作与作品近况"
        wechatQR: "img/wechat-qr.jpg"
        # 已换成真实公众号二维码（2026-10-25）。这个标志位控制页面上
        # "二维码待替换"提示与 alt 文案，为 true 时会显示占位说明。
        wechatPlaceholder: false
    # author: ["Me", "You"] # multiple authors

    mainSections: ["posts"]
    ShowAllPagesInArchive: true

    # 分类中英文映射
    categoryNames:
        tech: "技术分享"
        thinking: "思考笔记"
        diary: "生活日记"
        project-review: "项目复盘"

    profileMode:
        enabled: true
        title: "Coopers 的个人博客"
        subtitle: "Stay hungry, stay foolish"
        imageUrl: "img/avatar.svg"
        imageTitle: "Coopers"
        imageWidth: 150
        imageHeight: 150
        buttons:
          - name: 📚 文章
            url: posts
          - name: 🔖 标签
            url: tags
          - name: 📁 归档
            url: archives

    defaultTheme: light  # 新访客默认使用原来的白色主题
    disableThemeToggle: true  # 使用本地三主题选择器
    DateFormat: "2006-01-02"
    ShowShareButtons: true
    ShowReadingTime: true
    # disableSpecialistPost: true
    displayFullLangName: true
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    hideFooter: false # 隐藏页脚
    ShowWordCounts: true
    # 关闭访客计数（PaperMod 的不蒜子）。个人思考博客的价值不在访问量指标，
    # 阅读量/评论这类"互动装饰"已整体判定为伪需求并移除（见下方 comments 说明）。
    VisitCount: false

    ShowLastMod: true #显示文章更新时间

    ShowToc: true # 显示目录
    TocOpen: true # 自动展开目录

    # 无评论系统（刻意为之）：Twikoo + 腾讯云 CloudBase 需 ¥19.9/月且引入第三方后端，
    # 2026-10-22 判定为伪需求。将来若要评论，优先 GitHub Discussions / Giscus 这类零后端方案。
    comments: false
    
    socialIcons:
        - name: github
          url: "https://github.com/wsqyouth/"
        - name: other
          url: "https://youth.blog.csdn.net/"
          title: "CSDN"
        - name: email
          url: "mailto:wsqyouth@qq.com"
        - name: rss
          url: "index.xml"

    # editPost:
    #     URL: "https://github.com/adityatelange/hugo-PaperMod/tree/exampleSite/content"
    #     Text: "Suggest Changes" # edit text
    #     appendFilePath: true # to append file path to Edit link

    # label:
    #     text: "Home"
    #     icon: icon.png
    #     iconHeight: 35

    # analytics:
    #     google:
    #         SiteVerificationTag: "XYZabc"

    assets:
        favicon: "img/favicon.ico"
        favicon16x16: "img/favicon.ico"
        favicon32x32: "img/favicon.ico"
        apple_touch_icon: "favicon.ico"
        safari_pinned_tab: "favicon.ico"

    # cover:
    #     hidden: true # hide everywhere but not in structured data
    #     hiddenInList: true # hide on list pages and home
    #     hiddenInSingle: true # hide on single page

    fuseOpts:
        isCaseSensitive: false
        shouldSort: true
        location: 0
        distance: 1000
        threshold: 0.4
        minMatchCharLength: 0
        keys: ["title", "summary", "content"]

    # Twikoo（评论 + 阅读量，腾讯云 CloudBase）曾配置于此，2026-10-22 判定为伪需求整体移除：
    # 静态个人博客的价值在内容可读与可发现，不在互动指标；且免费体验版根本部署不了
    # （CORS 白名单为付费专属），要跑起来得付 ¥19.9/月，性价比不成立。
    # 相关 partial / shortcode / css 已同步删除，如需复活见 git history。

    # 数学公式支持。总闸，默认开启。
    # 真正决定是否加载 KaTeX 的是**文章 front matter 的 math: true**——
    # 所以平时不用动这里；只有想彻底禁用整个站的数学支持时才设 false。
    # Hugo 侧同时要开 passthrough（见文件末尾 markup.goldmark.extensions），
    # 否则 $$...$$ 会被当成普通文本，LaTeX 宏包根本拿不到。
    math:
        enabled: true

    # 克制的评论区：Giscus，用 GitHub Discussions 当后端。
    # 免费、无追踪、无广告，数据在自己仓库里；站点保持纯静态，不引入任何要运维的服务。
    # 刻意不做成常驻评论区——绝大多数读者不留言，常驻只会占用阅读空间。
    # 现在默认只渲染一个入口按钮，点一下才加载（见 layouts/partials/giscus.html）。
    #
    # 三个 id 齐了才会渲染，缺任何一个就什么都不输出（干净降级）。
    # 开通步骤（一次性，约 2 分钟）：
    #   1. 仓库 Settings → General → Features → 勾选 Discussions
    #   2. 安装 giscus app：https://github.com/apps/giscus （选 coopers_hugo_blog）
    #   3. 到 https://giscus.app 填仓库名，复制生成的 category-id 填到下面
    giscus:
      repo: "wsqyouth/coopers_hugo_blog"
      repoId: "R_kgDOQuhelQ"
      category: "Announcements"
      categoryId: ""
      mapping: "pathname"
      lang: "zh-CN"

taxonomies:
    category: categories
    tag: tags
    series: series

markup:
    goldmark:
        renderer:
            unsafe: true # HUGO 默认转义 Markdown 文件中的 HTML 代码，如需开启的话
        extensions:
            # 让 $$...$$ 与 $...$ 原样传给前端（不被 goldmark 当普通文本处理）。
            # KaTeX 的加载在 extend_head.html，按 params.math.enabled + 文章 front matter
            # 的 math: true 双重判断——没用上公式的页面不会引入外部脚本。
            #
            # ⚠️ 坑：delimiters 是**嵌套数组**，每一项是一对 [左, 右]。
            # 写成扁平数组（奇数个）会让 Hugo 直接 panic：
            #   panic: index out of range [1] with length 1
            # 报错是 Go 堆栈，完全看不出是配置问题。
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - '$$'
                          - '$$'
                    inline:
                        - - '$'
                          - '$'
    highlight:
        # anchorLineNos: true
        codeFences: true
        guessSyntax: true
        lineNos: true
        noClasses: false
        # style: monokai
        # style: darcula

        # codeFences：代码围栏功能，这个功能一般都要设为 true 的，不然很难看，就是干巴巴的-代码文字，没有颜色。
        # guessSyntax：猜测语法，这个功能建议设置为 true, 如果你没有设置要显示的语言则会自动匹配。
        # hl_Lines：高亮的行号，一般这个不设置，因为每个代码块我们可能希望让高亮的地方不一样。
        # lineNoStart：行号从编号几开始，一般从 1 开始。
        # lineNos：是否显示行号，我比较喜欢显示，所以我设置的为 true.
        # lineNumbersInTable：使用表来格式化行号和代码,而不是 标签。这个属性一般设置为 true.
        # noClasses：使用 class 标签，而不是内嵌的内联样式

privacy:
    vimeo:
        disabled: false
        simple: true

    x:
        disabled: false
        enableDNT: true
        simple: true

    instagram:
        disabled: false
        simple: true

    youtube:
        disabled: false
        privacyEnhanced: true

services:
    instagram:
        disableInlineCSS: true
    x:
        disableInlineCSS: true
