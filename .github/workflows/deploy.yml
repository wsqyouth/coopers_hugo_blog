name: 部署Hugo博客到服务器

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: true  # 如果主题使用了submodule
          fetch-depth: 0    # 获取完整历史以便Hugo正确设置.GitInfo和.Lastmod

      - name: 安装Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.148.2'
          extended: true

      - name: 构建Hugo网站
        run: hugo --minify
        env:
          HUGO_ENV: production

      - name: 部署到服务器
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT || 22 }}
          SOURCE: "public/"
          TARGET: ${{ secrets.REMOTE_TARGET }}
          EXCLUDE: ".git*, .github*, node_modules*, **/.DS_Store"
          # 默认参数是 "-rlgoDzvc -i"，**没有删除语义**：源端删掉的文件在服务器上
          # 会永远留着 —— 于是「删文章」在线上是假的（实测：仓库只剩 207 个文件，
          # 服务器堆着 373 个，其中 166 个是已删文章 / 旧 permalink 布局 / 旧 CSS 指纹）。
          # --delete-delay 而非 --delete：把删除推迟到传输结束再执行，缩短线上
          # 出现"文件已传完但旧文件还在"的中间态窗口。
          ARGS: "-rlgoDzvc -i --delete-delay"
          SCRIPT_BEFORE: |
            echo "开始部署..."
            # 安全闸：开了 --delete 之后，源端为空就等于清空线上站点。
            # 构建产物缺失/为空时直接失败，宁可不发布也不能把站点删空。
            if [ ! -s "${{ github.workspace }}/public/index.html" ]; then
              echo "构建产物缺失或为空，拒绝执行 rsync --delete（否则会清空线上站点）" >&2
              exit 1
            fi
            echo "构建产物校验通过：$(find "${{ github.workspace }}/public" -type f | wc -l) 个文件"
          SCRIPT_AFTER: |
            echo "部署完成！"
            # 可以在这里添加其他命令，如重启nginx等
            # sudo systemctl reload nginx

# 配置说明：
# 需要在GitHub仓库 Settings -> Secrets and variables -> Actions 中配置以下secrets：
#
# 必需的Secrets：
# - SSH_PRIVATE_KEY: SSH私钥内容
# - REMOTE_HOST: 服务器IP或域名
# - REMOTE_USER: SSH登录用户名
# - REMOTE_TARGET: 网站文件目标路径（如：/var/www/wsqyouth.cn/）
#
# 可选的Secrets：
# - REMOTE_PORT: SSH端口（默认22）
